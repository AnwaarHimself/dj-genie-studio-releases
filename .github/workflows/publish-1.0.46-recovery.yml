name: Publish DJ Genie Studio 1.0.46 recovery
on:
  push:
    paths:
      - '.github/workflows/publish-1.0.46-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-release:
    name: Publish verified Mac installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified macOS artifact
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-4fa4-81fd-b990-45b534dfa696/raw?se=2026-11-26T05%3A15%3A53Z&sp=r&sv=2026-06-06&sr=b&scid=bee74f0a-b6e5-5bde-91d9-56a9cbb73bbb&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T23%3A04%3A25Z&ske=2026-11-26T23%3A04%3A25Z&sks=b&skv=2026-06-06&sig=f9yN49b%2BVvz4iBD9tDA1yv3dK1KyLqu9b68DXFT/CrY%3D'
        run: |
          curl -fL --retry 3 --retry-delay 2 --max-time 240 "$ARTIFACT_URL" -o /tmp/djgenie-installers.zip
          test "$(stat -c%s /tmp/djgenie-installers.zip)" -gt 200000000
          echo "e2141f28594c4d3cb4ee74ca55b3aa000c0e2433bee9b07009836b1f31956c32  /tmp/djgenie-installers.zip" | sha256sum -c -
          unzip -q /tmp/djgenie-installers.zip -d /tmp/djgenie-installers
          echo "8af174c4c925b1c9972a66b9a93fb3eef2892afb3c92009e006041975b98fc4b  /tmp/djgenie-installers/DJ.Genie.Studio-1.0.46-intel-x64.dmg" | sha256sum -c -
          echo "3508aa83c3af0957a6131dac76adf6c96c2cf82a02cfc0af6b853d9f493be69f  /tmp/djgenie-installers/DJ.Genie.Studio-1.0.46-apple-silicon.dmg" | sha256sum -c -
      - name: Publish GitHub release with public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: AnwaarHimself/dj-genie-studio-releases
        run: |
          gh release create v1.0.46 /tmp/djgenie-installers/*.dmg --title "DJ Genie Studio 1.0.46 — Recovery Fix" --notes "Urgent startup recovery: unblocks Start Gig when an unscanned library has no genres; repairs legacy DJ Genie database migration without resetting DJ-owned work. Signed/notarized: no. Choose Intel x64 or Apple Silicon according to your Mac. Minimum macOS 11. Do not delete your existing DJ Genie library. Existing Catalina 1.0.45 remains separate pending Catalina rebuild." --latest
          gh release view v1.0.46 --json assets,url,name
