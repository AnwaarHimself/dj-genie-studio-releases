name: Verify production website recovery downloads
on:
  push:
    paths:
      - '.github/workflows/verify-live-website-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    name: Verify existing website links and disclose emergency version
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify actual website URLs and public downloads
        run: |
          curl -fLsS --max-time 30 https://djgeniestudio.com/download -o /tmp/site.html
          echo "Live /download reports:"
          grep -Eo '1\.0\.[0-9]+' /tmp/site.html | sort -u | tail -n 10 || true
          for name in DJ.Genie.Studio-1.0.45-universal.dmg DJ.Genie.Studio-1.0.45-catalina-x64.dmg; do
            url="https://github.com/AnwaarHimself/dj-genie-studio-releases/releases/download/v1.0.45/$name"
            echo "Checking public URL: $url"
            curl -fLsSI --retry 3 --max-time 40 "$url" -o /tmp/headers
            tail -n 8 /tmp/headers
          done
      - name: Disclose compatibility hotfix in existing release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: AnwaarHimself/dj-genie-studio-releases
        run: |
          gh release edit v1.0.45 --notes "EMERGENCY RECOVERY NOTICE (November 25, 2026): The original DJ Genie Studio 1.0.45 installers had a startup and legacy database migration bug. To restore the existing website download URLs without waiting for the blocked website deployment, both 1.0.45-named DMG assets have been replaced by verified version 1.0.46 installers. The filenames remain 1.0.45 for compatibility; the app itself is 1.0.46. Catalina and universal Mac installers both contain the recovery fix. No Serato files are modified. Downloading from the website again provides the corrected application."
          gh release edit v1.0.46 --notes "DJ Genie Studio 1.0.46 — urgent recovery. Fixes blocked first-run Start Gig screen when no genres have been scanned, and safely migrates existing Music Prep data before creating account indexes. Preserves user library. Available for universal Mac (macOS 11+), separate Apple Silicon or Intel Mac (macOS 11+), and Catalina Intel (macOS 10.15). The installers are unsigned and unnotarized. Existing website links labeled 1.0.45 now download these repaired 1.0.46 builds; the website label is awaiting deployment."
